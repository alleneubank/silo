name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Mints the OIDC token npm trusted publishing authenticates with.
      # Without it npm rejects the publish as E404.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node for npm publish
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1; the npm
          # bundled with any Node 20 is far below that and fails obscurely.
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"

      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: npx changeset publish
          title: "chore: release"
          commit: "chore: release"
        env:
          # No npm token: the registry authenticates this workflow through OIDC
          # against the trusted publisher configured on the package
          # (alleneubank/silo, release.yml). Provenance is attached automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
