name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Mints the OIDC token npm trusted publishing authenticates with.
      # Without it npm rejects the publish as E404.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node for npm publish
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1, and current npm majors set
          # their own Node floor (npm 12 wants ^24.15.0). Track the Node 24 line
          # rather than pinning a patch that npm@latest will outgrow.
          node-version: "24"
          # No registry-url on purpose. It writes an .npmrc pinning
          # _authToken=${NODE_AUTH_TOKEN}, and with OIDC there is no token, so
          # every registry read goes out unauthorized: `changeset publish` then
          # reads an already-published version as missing and tries to publish
          # it again. registry.npmjs.org is the default anyway, and the OIDC
          # exchange does not read .npmrc.

      # npm 11, not npm@latest: 11.5.1+ does trusted publishing, and npm 12
      # changed `npm info --json` to emit an array where 11 emits an object.
      # changesets reads `.versions` off that object, so under npm 12 it reads
      # every published package as unpublished and republishes on every run.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: npx changeset publish
          title: "chore: release"
          commit: "chore: release"
        env:
          # No npm token: the registry authenticates this workflow through OIDC
          # against the trusted publisher configured on the package
          # (alleneubank/silo, release.yml). Do not set publishConfig.provenance:
          # npm rejects attestations from a private GitHub repo (E422), even
          # for a public package. Trusted publishing still authenticates.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
