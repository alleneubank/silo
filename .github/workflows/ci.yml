name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install pinned Janitor for native launch tests
        run: |
          curl -fsSL https://raw.githubusercontent.com/alleneubank/janitor/v0.3.1/install.sh | JANITOR_VERSION=v0.3.1 PREFIX="$RUNNER_TEMP/janitor" sh
          echo "$RUNNER_TEMP/janitor/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check
        run: bun run check

      - name: Test
        run: bun test
