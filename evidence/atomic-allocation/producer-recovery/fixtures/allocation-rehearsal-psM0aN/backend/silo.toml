version=1

[ports]
APP_PORT=48127
TILT_PORT=48128
K3D_REGISTRY_PORT=48130
HTTP_PORT=48131
[hosts]
APP_HOST="${name}.localhost"
TILT_HOST="127.0.0.1"
[tilt]
webMode="prod"
[profiles.alternative.ports]
APP_PORT=48129

[k3d]
enabled=true
kubeconfigPath=".localnet/kubeconfig"
args=["--port=${HTTP_PORT}:80@loadbalancer"]
[k3d.registry]
enabled=true
